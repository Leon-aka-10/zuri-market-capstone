name: deploy
on:
  push:
    branches: [main]
    paths: ['terraform/**', 'k8s/**', 'scripts/**', 'monitoring/**', '.github/workflows/deploy.yml']
  workflow_dispatch:
    inputs:
      action:
        description: Terraform action for the dev environment
        type: choice
        options: [apply, destroy]
        default: apply

permissions:
  id-token: write # OIDC to AWS
  contents: read

# Never cancel a running terraform apply
concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_DIR: terraform/environments/dev
  TF_ACTION: ${{ inputs.action || 'apply' }}

jobs:
  infra:
    name: Infra - terraform ${{ inputs.action || 'apply' }}
    runs-on: ubuntu-latest
    outputs:
      instance_id: ${{ steps.out.outputs.instance_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ vars.AWS_INFRA_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: "~> 1.11"
          terraform_wrapper: false
      - name: fmt, init, validate
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform fmt -check -recursive ../..
          terraform init -input=false
          terraform validate
      - name: Plan
        working-directory: ${{ env.TF_DIR }}
        run: |
          if [ "$TF_ACTION" = "destroy" ]; then
            terraform plan -destroy -input=false -var-file=dev.tfvars -out=tfplan
          else
            terraform plan -input=false -var-file=dev.tfvars -out=tfplan
          fi
      - name: Apply
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -input=false tfplan
      - name: Seed the secret value if it has none (never enters state or logs)
        if: env.TF_ACTION == 'apply'
        run: |
          if ! aws secretsmanager get-secret-value --secret-id zuri/dev/backend >/dev/null 2>&1; then
            aws secretsmanager put-secret-value --secret-id zuri/dev/backend \
              --secret-string "$(jq -nc --arg k "$(openssl rand -hex 32)" '{API_SECRET_KEY:$k}')" >/dev/null
            echo "Secret value created."
          else
            echo "Secret already has a value."
          fi
      - name: Export instance id
        id: out
        if: env.TF_ACTION == 'apply'
        working-directory: ${{ env.TF_DIR }}
        run: echo "instance_id=$(terraform output -raw instance_id)" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy - kubernetes on the node
    needs: infra
    if: ${{ (inputs.action || 'apply') == 'apply' }}
    runs-on: ubuntu-latest
    env:
      INSTANCE_ID: ${{ needs.infra.outputs.instance_id }}
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Wait for the node to register with SSM
        run: |
          for _ in $(seq 1 60); do
            s=$(aws ssm describe-instance-information \
                  --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
                  --query 'InstanceInformationList[0].PingStatus' --output text 2>/dev/null || true)
            [ "$s" = "Online" ] && exit 0
            sleep 15
          done
          echo "Node never came online in SSM"; exit 1
      - name: Run the deploy script on the node through SSM
        run: |
          jq -nc --arg sha "$GITHUB_SHA" '{commands: [
            "set -e",
            "export HOME=/root",
            "mkdir -p /opt/zuri",
            "[ -d /opt/zuri/repo/.git ] || git clone https://github.com/Leon-aka-10/zuri-market-capstone.git /opt/zuri/repo",
            "cd /opt/zuri/repo",
            "git fetch --quiet origin",
            ("git checkout --force --quiet " + $sha),
            "bash scripts/deploy-on-node.sh dev"
          ]}' > params.json

          CMD_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript --comment "deploy ${GITHUB_SHA::7}" \
            --timeout-seconds 1200 --parameters file://params.json \
            --query Command.CommandId --output text)
          echo "SSM command: $CMD_ID"

          st=Pending
          for _ in $(seq 1 120); do
            st=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
                   --query Status --output text 2>/dev/null || echo Pending)
            case "$st" in Success|Failed|Cancelled|TimedOut|Cancelling) break ;; esac
            sleep 10
          done

          echo "---- stdout (last 2500 chars, SSM limit) ----"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          echo "---- stderr ----"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text
          echo "Final status: $st"
          [ "$st" = "Success" ]
