apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuri-backend
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Leon-aka-10/zuri-market-capstone.git
    targetRevision: main
    path: k8s/backend
  destination:
    server: https://kubernetes.default.svc
    namespace: zuri-market
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff: { duration: 15s, factor: 2, maxDuration: 3m }
